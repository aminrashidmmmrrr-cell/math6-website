<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کتاب ریاضی ششم دبستان | نسخه تعاملی</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">

    <style>
        /* ============ متغیرها ============ */
        :root {
            --lilac-bg: #f6f2fb;
            --lilac-soft: #ede4f8;
            --lilac-border: #d8b4fe;
            --lilac-main: #9333ea;
            --lilac-dark: #6b21a8;
            --blue-soft: #e0f2fe;
            --blue-main: #0284c7;
            
            --glass-bg: rgba(255, 255, 255, 0.82);
            --glass-border: rgba(255, 255, 255, 0.9);
            --glass-shadow: 0 16px 40px rgba(147, 51, 234, 0.12);
            
            --text-title: #3b0764;
            --text-body: #475569;
            --text-muted: #64748b;

            --paper-color: #fdfbf7;
            --paper-shadow: inset 0 0 60px rgba(120, 80, 40, 0.04);
            
            /* رنگ‌های نشانک هر فصل */
            --ribbon-1: #f43f5e;
            --ribbon-2: #f59e0b;
            --ribbon-3: #10b981;
            --ribbon-4: #06b6d4;
            --ribbon-5: #8b5cf6;
            --ribbon-6: #ec4899;
            --ribbon-7: #6366f1;
        }

        /* تم تاریک */
        body.dark-theme {
            --lilac-bg: #1e1b2e;
            --lilac-soft: #2d2640;
            --lilac-border: #4c3d6b;
            --lilac-main: #a855f7;
            --lilac-dark: #c084fc;
            --text-title: #f3e8ff;
            --text-body: #cbd5e1;
            --text-muted: #94a3b8;
            --paper-color: #2a2438;
            --glass-bg: rgba(45, 38, 64, 0.85);
            --glass-border: rgba(168, 85, 247, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--lilac-bg);
            color: var(--text-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
            transition: background-color 0.5s;
        }

        /* ============ پس‌زمینه محو ============ */
        .ambient-cover-bg {
            position: fixed;
            inset: 0;
            background-image: url('figures/cover.png');
            background-size: cover;
            background-position: center;
            filter: blur(65px) saturate(1.4);
            opacity: 0.22;
            z-index: -2;
            transform: scale(1.1);
            transition: opacity 0.5s;
        }

        body.dark-theme .ambient-cover-bg {
            opacity: 0.1;
        }

        /* ============ ذرات شناور تزئینی ============ */
        .particles-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, var(--lilac-main), transparent);
            border-radius: 50%;
            opacity: 0.4;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        /* ============ هدر ============ */
        .header-bar {
            max-width: 1050px;
            width: calc(100% - 32px);
            margin: 16px auto 0;
            padding: 12px 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--glass-shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            z-index: 50;
            transition: all 0.3s;
        }

        .book-branding {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 900;
            font-size: 1.15rem;
            color: var(--text-title);
        }

        .badge-edition {
            background: linear-gradient(135deg, var(--lilac-main), var(--blue-main));
            color: white;
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 700;
        }

        .header-widgets {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .widget-chip {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid var(--lilac-border);
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--lilac-dark);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        body.dark-theme .widget-chip {
            background: rgba(45, 38, 64, 0.9);
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            border: 1px solid var(--lilac-border);
            display: grid;
            place-items: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
            color: var(--lilac-dark);
        }

        .icon-btn:hover {
            background: var(--lilac-main);
            color: white;
            transform: scale(1.1) rotate(15deg);
        }

        body.dark-theme .icon-btn {
            background: rgba(45, 38, 64, 0.9);
        }

        /* ============ نوار پیشرفت مطالعه ============ */
        .progress-bar-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(0,0,0,0.05);
            z-index: 200;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--lilac-main), var(--blue-main));
            width: 0%;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(147, 51, 234, 0.5);
        }

        /* ============ محیط اصلی ============ */
        .stage-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            perspective: 2500px;
        }

        /* ============ ۱. حالت بسته - کتاب سه‌بعدی ============ */
        .closed-book-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .closed-book-view.hidden {
            display: none;
        }

        .book-3d-wrapper {
            position: relative;
            width: 300px;
            height: 430px;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.3, 1);
            animation: bookIntro 1s cubic-bezier(0.2, 0.8, 0.3, 1) both;
        }

        @keyframes bookIntro {
            from { opacity: 0; transform: rotateY(-90deg) scale(0.8); }
            to { opacity: 1; transform: rotateY(0) scale(1); }
        }

        .book-3d-wrapper:hover {
            transform: rotateY(-22deg) rotateX(8deg) translateY(-10px) scale(1.03);
        }

        /* جلد اصلی */
        .book-cover-leaf {
            width: 100%;
            height: 100%;
            border-radius: 4px 14px 14px 4px;
            overflow: hidden;
            background: #fff;
            position: relative;
            box-shadow: 
                -4px 4px 0px #e2e8f0,
                -8px 8px 0px #cbd5e1,
                -12px 12px 0px #b8c1cc,
                -16px 16px 30px rgba(76, 29, 149, 0.3),
                0 30px 60px rgba(76, 29, 149, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transform-style: preserve-3d;
        }

        .book-cover-leaf img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* درخشش متحرک روی جلد */
        .book-shine {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                115deg,
                transparent 30%,
                rgba(255,255,255,0.4) 45%,
                rgba(255,255,255,0.6) 50%,
                rgba(255,255,255,0.4) 55%,
                transparent 70%
            );
            background-size: 300% 300%;
            animation: shineMove 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes shineMove {
            0%, 100% { background-position: -100% 0; }
            50% { background-position: 200% 0; }
        }

        /* عطف تیره سمت راست */
        .book-spine-line {
            position: absolute;
            top: 0;
            bottom: 0;
            right: 0;
            width: 28px;
            background: linear-gradient(to left, 
                rgba(0,0,0,0.45) 0%, 
                rgba(0,0,0,0.2) 40%, 
                rgba(0,0,0,0.05) 80%,
                transparent 100%);
            pointer-events: none;
        }

        /* هایلایت لبه جلد */
        .book-edge-light {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 3px;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.8), transparent);
            opacity: 0.7;
        }

        /* دکمه باز کردن */
        .open-book-btn {
            background: linear-gradient(135deg, var(--lilac-main), var(--lilac-dark));
            color: white;
            border: 2px solid white;
            padding: 14px 36px;
            border-radius: 35px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(147, 51, 234, 0.35);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s;
            position: relative;
            overflow: hidden;
        }

        .open-book-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.5) 50%, transparent 70%);
            background-size: 200% 100%;
            animation: btnShine 3s ease-in-out infinite;
        }

        @keyframes btnShine {
            0%, 100% { background-position: 200% 0; }
            50% { background-position: -100% 0; }
        }

        .open-book-btn:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 16px 36px rgba(147, 51, 234, 0.45);
        }

        .open-book-btn:active {
            transform: translateY(-1px) scale(1.01);
        }

        /* راهنمای کیبورد */
        .keyboard-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            display: flex;
            gap: 8px;
            align-items: center;
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        kbd {
            background: white;
            border: 1px solid var(--lilac-border);
            border-radius: 5px;
            padding: 2px 7px;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--lilac-dark);
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
        }

        /* ============ ۲. حالت باز - کتاب دو صفحه‌ای ============ */
        .opened-book-view {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 980px;
            animation: bookOpenFadeIn 0.7s cubic-bezier(0.2, 0.8, 0.3, 1);
        }

        .opened-book-view.visible {
            display: flex;
        }

        @keyframes bookOpenFadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* نشانک‌های رنگی بالای کتاب */
        .chapter-ribbons {
            display: flex;
            gap: 8px;
            margin-bottom: -12px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 10px;
        }

        .ribbon-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid var(--lilac-border);
            border-bottom: none;
            padding: 7px 16px;
            border-radius: 14px 14px 0 0;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
            position: relative;
            transform-origin: bottom center;
        }

        .ribbon-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 -4px 12px rgba(147, 51, 234, 0.15);
        }

        .ribbon-btn.active {
            background: var(--paper-color);
            color: var(--lilac-dark);
            transform: translateY(-2px) scale(1.05);
            font-weight: 800;
            z-index: 2;
        }

        /* رنگ هر نشانک */
        .ribbon-btn[data-ch="1"] { border-color: var(--ribbon-1); }
        .ribbon-btn[data-ch="2"] { border-color: var(--ribbon-2); }
        .ribbon-btn[data-ch="3"] { border-color: var(--ribbon-3); }
        .ribbon-btn[data-ch="4"] { border-color: var(--ribbon-4); }
        .ribbon-btn[data-ch="5"] { border-color: var(--ribbon-5); }
        .ribbon-btn[data-ch="6"] { border-color: var(--ribbon-6); }
        .ribbon-btn[data-ch="7"] { border-color: var(--ribbon-7); }

        .ribbon-btn[data-ch="1"].active { background: linear-gradient(to bottom, var(--paper-color), rgba(244, 63, 94, 0.15)); }
        .ribbon-btn[data-ch="2"].active { background: linear-gradient(to bottom, var(--paper-color), rgba(245, 158, 11, 0.15)); }
        .ribbon-btn[data-ch="3"].active { background: linear-gradient(to bottom, var(--paper-color), rgba(16, 185, 129, 0.15)); }
        .ribbon-btn[data-ch="4"].active { background: linear-gradient(to bottom, var(--paper-color), rgba(6, 182, 212, 0.15)); }
        .ribbon-btn[data-ch="5"].active { background: linear-gradient(to bottom, var(--paper-color), rgba(139, 92, 246, 0.15)); }
        .ribbon-btn[data-ch="6"].active { background: linear-gradient(to bottom, var(--paper-color), rgba(236, 72, 153, 0.15)); }
        .ribbon-btn[data-ch="7"].active { background: linear-gradient(to bottom, var(--paper-color), rgba(99, 102, 241, 0.15)); }

        .ribbon-btn.completed::after {
            content: "✓";
            position: absolute;
            top: -5px;
            right: -5px;
            width: 16px;
            height: 16px;
            background: var(--success);
            color: white;
            border-radius: 50%;
            font-size: 10px;
            display: grid;
            place-items: center;
            font-weight: 900;
        }

        /* صحنه سه‌بعدی کتاب */
        .book-stage-3d {
            position: relative;
            width: 100%;
            min-height: 500px;
            perspective: 2800px;
            border-radius: 20px;
            box-shadow: 
                0 4px 0px #e2e8f0,
                0 8px 0px #cbd5e1,
                0 12px 0px #b8c1cc,
                0 30px 70px rgba(76, 29, 149, 0.22);
            transition: box-shadow 0.5s;
        }

        /* صفحات پایه */
        .book-spread-base {
            background: var(--paper-color);
            width: 100%;
            height: 100%;
            border-radius: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
            border: 1px solid rgba(216, 180, 254, 0.5);
            position: relative;
            min-height: 500px;
        }

        /* سایه عطف وسط */
        .book-spread-base::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 60px;
            transform: translateX(-50%);
            background: linear-gradient(to right, 
                rgba(0,0,0,0.12) 0%, 
                rgba(0,0,0,0.04) 30%, 
                rgba(0,0,0,0.01) 50%,
                rgba(0,0,0,0.04) 70%,
                rgba(0,0,0,0.12) 100%);
            pointer-events: none;
            z-index: 5;
        }

        /* صفحه راست: تصویر فصل */
        .page-content-right {
            padding: 28px;
            background: linear-gradient(to left, var(--paper-color) 88%, rgba(237, 228, 248, 0.5) 100%);
            display: flex;
            flex-direction: column;
            gap: 16px;
            border-left: 1px solid rgba(0, 0, 0, 0.05);
            position: relative;
            box-shadow: var(--paper-shadow);
        }

        /* بافت کاغذ */
        .page-content-right::before,
        .page-content-left::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.02) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(14, 165, 233, 0.02) 0%, transparent 50%);
            pointer-events: none;
        }

        .chapter-tag-pill {
            align-self: flex-start;
            background: var(--lilac-soft);
            color: var(--lilac-dark);
            font-size: 0.8rem;
            font-weight: 800;
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid var(--lilac-border);
        }

        .chapter-title-text {
            font-size: 1.45rem;
            font-weight: 900;
            color: var(--text-title);
            line-height: 1.4;
        }

        .chapter-figure-box {
            width: 100%;
            height: 260px;
            border-radius: 16px;
            overflow: hidden;
            background: #f1f5f9;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border: 1px solid var(--lilac-border);
            position: relative;
        }

        .chapter-figure-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s;
        }

        .chapter-figure-box:hover img {
            transform: scale(1.05);
        }

        /* صفحه چپ: لیست درس‌ها */
        .page-content-left {
            padding: 28px;
            background: linear-gradient(to right, var(--paper-color) 88%, rgba(237, 228, 248, 0.5) 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: var(--paper-shadow);
        }

        .lessons-title-header {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--lilac-dark);
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 2px dashed var(--lilac-border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lessons-stack {
            display: flex;
            flex-direction: column;
            gap: 9px;
            margin-bottom: 16px;
        }

        .lesson-row-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--lilac-border);
            padding: 11px 16px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-title);
            font-size: 0.92rem;
            font-weight: 700;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .lesson-row-link::before {
            content: "";
            position: absolute;
            right: -100%;
            top: 0;
            bottom: 0;
            width: 100%;
            background: linear-gradient(90deg, transparent, rgba(147, 51, 234, 0.15), transparent);
            transition: right 0.5s;
        }

        .lesson-row-link:hover::before {
            right: 100%;
        }

        .lesson-row-link:hover {
            background: var(--lilac-main);
            color: white;
            border-color: var(--lilac-main);
            transform: translateX(-6px) scale(1.02);
            box-shadow: 0 6px 16px rgba(147, 51, 234, 0.25);
        }

        .lesson-row-link.exam-item {
            background: var(--blue-soft);
            border-color: #bae6fd;
            color: var(--blue-main);
        }

        .lesson-row-link.exam-item:hover {
            background: var(--blue-main);
            color: white;
            border-color: var(--blue-main);
        }

        body.dark-theme .lesson-row-link {
            background: rgba(42, 36, 56, 0.8);
        }

        /* ============ برگه چرخان ============ */
        .flipper-leaf {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            transform-style: preserve-3d;
            pointer-events: none;
            z-index: 20;
            display: none;
        }

        .flipper-leaf.flip-forward {
            display: block;
            left: 0;
            transform-origin: right center;
            animation: turnPageForward 0.85s cubic-bezier(0.45, 0.05, 0.25, 1) forwards;
        }

        .flipper-leaf.flip-backward {
            display: block;
            right: 0;
            transform-origin: left center;
            animation: turnPageBackward 0.85s cubic-bezier(0.45, 0.05, 0.25, 1) forwards;
        }

        @keyframes turnPageForward {
            0% {
                transform: rotateY(0deg);
            }
            25% {
                transform: rotateY(30deg);
            }
            50% {
                transform: rotateY(90deg);
            }
            75% {
                transform: rotateY(150deg);
            }
            100% {
                transform: rotateY(180deg);
            }
        }

        @keyframes turnPageBackward {
            0% {
                transform: rotateY(0deg);
            }
            25% {
                transform: rotateY(-30deg);
            }
            50% {
                transform: rotateY(-90deg);
            }
            75% {
                transform: rotateY(-150deg);
            }
            100% {
                transform: rotateY(-180deg);
            }
        }

        .leaf-face {
            position: absolute;
            inset: 0;
            background: var(--paper-color);
            backface-visibility: hidden;
            border-radius: 0 20px 20px 0;
            overflow: hidden;
        }

        .leaf-face.back {
            transform: rotateY(180deg);
            border-radius: 20px 0 0 20px;
            background: linear-gradient(to left, var(--paper-color) 90%, rgba(237, 228, 248, 0.6));
        }

        /* خمیدگی کاغذ در حین چرخش */
        .flipper-leaf::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, 
                rgba(0,0,0,0.15) 0%, 
                transparent 30%, 
                transparent 70%,
                rgba(0,0,0,0.15) 100%);
            z-index: 3;

            opacity: 0.7;
        }

            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(0,0,0,0.2), transparent 50%);
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            animation: paperShadow 0.85s ease-in-out;
        }

        @keyframes paperShadow {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        /* ============ نوار ناوبری ============ */
        .book-navigation-bar {
            display: flex;

            justify-content: space-between;

            align-items: center;

            background: var(--lilac-main);
            color: white;
            border-color: var(--lilac-main);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(147, 51, 234, 0.3);
        }

        .flip-arrow-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .close-book-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 8px 16px;
            border-radius: 10px;
            transition: all 0.2s;
        }

        .close-book-btn:hover {
            color: var(--lilac-dark);
            background: rgba(147, 51, 234, 0.08);
        }

        /* ============ چرک‌نویس ============ */
        .scratchpad-fab {
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--lilac-main), var(--blue-main));
            color: white;
            border: 3px solid white;
            box-shadow: 0 8px 28px rgba(147, 51, 234, 0.4);
            font-size: 1.5rem;
            display: grid;
            place-items: center;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .scratchpad-fab:hover {
            transform: scale(1.12) rotate(10deg);
            box-shadow: 0 12px 36px rgba(147, 51, 234, 0.55);
        }

            transform: scale(0.95);

            position: fixed;
            inset: 0;
            background: rgba(59, 7, 100, 0.35);

            place-items: center;

        }

            from { opacity: 0; }
            to { opacity: 1; }

            display: grid;
        }

            background: white;
            border-radius: 22px;
            padding: 20px;
            width: 100%;
            max-width: 540px;

            flex-direction: column;
            gap: 14px;

            from { transform: scale(0.85); opacity: 0; }

        }

            justify-content: space-between;

            gap: 10px;
        }

        .btn-clean {

            border-radius: 10px;
            font-weight: 700;

        }

        .shortcuts-hint.hidden {

            transform: translateY(20px);
            pointer-events: none;
        }

        .shortcut-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ============ Toast notification ============ */
        .toast {
            position: fixed;
            top: 90px;
            left: 50%;

        /* ==========================================================
           ذرات شناور

        function createParticles() {
            const container = document.getElementById('particles');
            const count = window.innerWidth < 768 ? 15 : 30;
            
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (8 + Math.random() * 12) + 's';
                p.style.animationDelay = (Math.random() * 10) + 's';
                p.style.width = p.style.height = (4 + Math.random() * 6) + 'px';
                container.appendChild(p);
            }
        }
        createParticles();

        /* ==========================================================
           صداگذاری واقع‌گرایانه ورق خوردن
           ========================================================== */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playRealisticPaperRustle() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const now = audioCtx.currentTime;
            const duration = 0.35;

            // لایه ۱: نویز فیلترشده (خش‌خش اصلی)
            const bufferSize = audioCtx.sampleRate * duration;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 0.5);
            }

            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1200, now);
            filter.frequency.exponentialRampToValueAtTime(400, now + duration);
            filter.Q.value = 2.5;

            const gain1 = audioCtx.createGain();
            gain1.gain.setValueAtTime(0.15, now);
            gain1.gain.linearRampToValueAtTime(0.02, now + duration);

            whiteNoise.connect(filter);
            filter.connect(gain1);
            gain1.connect(audioCtx.destination);
            whiteNoise.start(now);
            whiteNoise.stop(now + duration);

            // لایه ۲: صدای "کلیک" ملایم برای حس ورق کاغذ
            setTimeout(() => {
                const osc = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.08);
                gain2.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain2.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            }, duration * 1000 - 50);
        }

        // صدای "فِش" باز شدن کتاب
        function playBookOpenSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const now = audioCtx.currentTime;
            const duration = 0.5;

            const bufferSize = audioCtx.sampleRate * duration;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
            }

            const whiteNoise = audioCtx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(2000, now);
            filter.frequency.exponentialRampToValueAtTime(300, now + duration);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.001, now + duration);

            whiteNoise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            whiteNoise.start();
            whiteNoise.stop(now + duration);
        }

           ========================================================== */
        function openBook() {
            playBookOpenSound();
            document.getElementById('closed-view').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('opened-view').classList.add('visible');
                renderChapterInstant(1);
                showToast('📖 کتاب باز شد! فصلی را انتخاب کنید');
            }, 200);
        }

        function closeBook() {
            playRealisticPaperRustle();
            document.getElementById('opened-view').classList.remove('visible');
            setTimeout(() => {
                document.getElementById('closed-view').classList.remove('hidden');
            }, 200);
        }

        /* ==========================================================
           رندر فصل
           ========================================================== */
        function renderChapterInstant(ch) {
            activeChapter = ch;
            const data = bookData[ch];

            document.getElementById('ch-badge').innerText = data.badge;
            document.getElementById('ch-badge').style.borderColor = data.color;
            document.getElementById('ch-title').innerText = data.title;
            
            const img = document.getElementById('ch-img');
            img.src = data.img;
            img.onerror = function() {
                this.src = `https://placehold.co/400x260/9333ea/ffffff?text=${encodeURIComponent(data.badge)}`;
            };

            // نشانک‌ها
            document.querySelectorAll('.ribbon-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx + 1 === ch);
            });

            // لیست درس‌ها
            const listEl = document.getElementById('lessons-container');
            listEl.innerHTML = '';
            listEl.style.opacity = '0';
            
            data.lessons.forEach((l, idx) => {
                const a = document.createElement('a');
                a.href = l.url;
                a.className = `lesson-row-link ${l.isExam ? 'exam-item' : ''}`;
                a.innerHTML = `<span>${l.name}</span> <span>←</span>`;
                a.style.opacity = '0';
                a.style.transform = 'translateX(20px)';
                listEl.appendChild(a);
                
                setTimeout(() => {
                    a.style.transition = 'all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
                    a.style.opacity = '1';
                    a.style.transform = 'translateX(0)';
                }, idx * 60);
            });
            
            setTimeout(() => {
                listEl.style.transition = 'opacity 0.3s';
                listEl.style.opacity = '1';
            }, 50);

            // دکمه‌ها
            document.getElementById('prev-btn').disabled = (ch === 1);
            document.getElementById('next-btn').disabled = (ch === 7);

            // نوار پیشرفت
            updateProgress(ch);
        }

        /* ==========================================================
           ورق زدن
           ========================================================== */
        function flipToChapter(targetCh) {
            if (isFlipping || targetCh === activeChapter) return;
            if (targetCh < 1 || targetCh > 7) return;
            
            isFlipping = true;
            const isNext = targetCh > activeChapter;
            
            playRealisticPaperRustle();

            const flipper = document.getElementById('flipper-leaf');
            flipper.className = 'flipper-leaf ' + (isNext ? 'flip-forward' : 'flip-backward');

            // تغییر محتوا در وسط انیمیشن
            setTimeout(() => {
                renderChapterInstant(targetCh);
            }, 400);

            setTimeout(() => {
                flipper.className = 'flipper-leaf';
                isFlipping = false;
            }, 850);
        }

        function stepChapter(delta) {
            const next = activeChapter + delta;
            if (next >= 1 && next <= 7) {
                flipToChapter(next);
            }
        }

        // ساخت نشانک‌ها
        function buildRibbons() {
            const container = document.getElementById('ribbons-container');
            container.innerHTML = '';
            for (let i = 1; i <= 7; i++) {
                const btn = document.createElement('button');
                btn.className = 'ribbon-btn';
                btn.dataset.ch = i;
                btn.innerHTML = `فصل ${i.toLocaleString('fa-IR')}`;
                if (completedChapters.includes(i)) {
                    btn.classList.add('completed');
                }
                btn.onclick = () => flipToChapter(i);
                container.appendChild(btn);
            }
        }

        /* ==========================================================
           نوار پیشرفت
           ========================================================== */
        function updateProgress(ch) {
            const percent = ((ch - 1) / 6) * 100;
            document.getElementById('progress-fill').style.width = percent + '%';
            
            // علامت‌گذاری فصل به عنوان خوانده‌شده
            if (!completedChapters.includes(ch)) {
                completedChapters.push(ch);
                localStorage.setItem('completedChapters', JSON.stringify(completedChapters));
                document.querySelector(`.ribbon-btn[data-ch="${ch}"]`)?.classList.add('completed');
            }
        }

        /* ==========================================================
           ساعت و تاریخ
           ========================================================== */
        function initTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '۰');
            const m = String(now.getMinutes()).padStart(2, '۰');
            const s = String(now.getSeconds()).padStart(2, '۰');
            document.getElementById('clock-chip').innerHTML = `⏰ <span>${h}:${m}:${s}</span>`;

            const dateStr = new Intl.DateTimeFormat('fa-IR', {
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            }).format(now);
            document.getElementById('date-chip').innerHTML = `📅 <span>${dateStr}</span>`;
        }
        setInterval(initTime, 1000);
        initTime();

        /* ==========================================================
           چرک‌نویس
           ========================================================== */
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        let painting = false;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;
            ctx.scale(2, 2);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        function getCanvasPos(e) {
            const r = canvas.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (cx - r.left) * (canvas.width / r.width) / 2,
                y: (cy - r.top) * (canvas.height / r.height) / 2
            };
        }

        function startStroke(e) {
            painting = true;
            const p = getCanvasPos(e);
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = document.body.classList.contains('dark-theme') ? '#c084fc' : '#6b21a8';
        }

        function moveStroke(e) {
            if (!painting) return;
            e.preventDefault();
            const p = getCanvasPos(e);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
        }

        canvas.addEventListener('mousedown', startStroke);
        canvas.addEventListener('mousemove', moveStroke);
        window.addEventListener('mouseup', () => painting = false);
        canvas.addEventListener('touchstart', startStroke, { passive: false });
        canvas.addEventListener('touchmove', moveStroke, { passive: false });
        window.addEventListener('touchend', () => painting = false);

        document.getElementById('scratch-clear-btn').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        const scratchModal = document.getElementById('scratch-modal');
        document.getElementById('scratch-open-btn').addEventListener('click', () => {
            scratchModal.classList.add('open');
            setTimeout(resizeCanvas, 100);
        });
        document.getElementById('scratch-close-btn').addEventListener('click', () => scratchModal.classList.remove('open'));
        scratchModal.addEventListener('click', (e) => {
            if (e.target === scratchModal) scratchModal.classList.remove('open');
        });

        /* ==========================================================
           تم تاریک
           ========================================================== */
        const themeToggle = document.getElementById('theme-toggle');
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-theme');
            themeToggle.innerText = '☀️';
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            themeToggle.innerText = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            showToast(isDark ? '🌙 تم تاریک فعال شد' : '☀️ تم روشن فعال شد');
        });

        /* ==========================================================
           تمام‌صفحه
           ========================================================== */
        document.getElementById('fullscreen-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                showToast('⛶ حالت تمام‌صفحه');
            } else {
                document.exitFullscreen();
            }
        });

        /* ==========================================================
           میانبرهای کیبورد
           ========================================================== */
        document.addEventListener('keydown', (e) => {
            if (scratchModal.classList.contains('open')) return;
            
            const isOpen = document.getElementById('opened-view').classList.contains('visible');
            
            if (!isOpen) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    openBook();
                }
                return;
            }

            if (e.key === 'ArrowLeft') {
                stepChapter(1); // در RTL: چپ = بعدی
            } else if (e.key === 'ArrowRight') {
                stepChapter(-1); // در RTL: راست = قبلی
            } else if (e.key === 'Escape') {
                closeBook();
            } else if (e.key === 't' || e.key === 'T') {
                themeToggle.click();
            }
        });

        /* ==========================================================
           افکت پارالاکس جلد کتاب
           ========================================================== */
        const coverLeaf = document.getElementById('cover-leaf');
        document.addEventListener('mousemove', (e) => {
            if (!coverLeaf) return;
            const x = (e.clientX / window.innerWidth - 0.5) * 15;
            const y = (e.clientY / window.innerHeight - 0.5) * -15;
            coverLeaf.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        });

        /* ==========================================================
           Toast
           ========================================================== */
        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        /* ==========================================================
           راه‌اندازی
           ========================================================== */
        buildRibbons();
        
        // مخفی کردن راهنمای میانبر بعد از 8 ثانیه
        setTimeout(() => {
            document.getElementById('shortcuts-hint')?.classList.add('hidden');
        }, 8000);

        // پیام خوش‌آمد
        setTimeout(() => {
            showToast('👋 خوش آمدید! روی کتاب کلیک کنید');
        }, 1000);
    </script>
</body>
